name: (temp) fetch real cover images from BGG
on:
  workflow_dispatch:
  push:
    branches: [claude/boardgame-barcode-scanner-9zh92l]
    paths:
      - '.github/workflows/_tmp-fetch-covers.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Wikipedia REST API reachability
        run: |
          curl -sS -i "https://en.wikipedia.org/api/rest_v1/page/summary/Catan" -H "User-Agent: board-game-matcher/1.0 (test)" | head -40
