name: (temp) fetch real cover images from BGG
on:
  workflow_dispatch:
  push:
    branches: [claude/boardgame-barcode-scanner-9zh92l]
    paths:
      - '.github/workflows/_tmp-fetch-covers.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch covers from BGG
        run: |
          mkdir -p public/covers
          cat > fetch_covers.py << 'PYEOF'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          GAMES = [
              ("catan", "Catan"),
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.read()

          results = {}
          for game_id, query in GAMES:
              try:
                  search_url = f"https://boardgamegeek.com/xmlapi2/search?type=boardgame&query={urllib.parse.quote(query)}"
                  data = fetch(search_url)
                  root = ET.fromstring(data)
                  item = root.find("item")
                  if item is None:
                      results[game_id] = {"ok": False, "reason": "no search result"}
                      continue
                  bgg_id = item.get("id")
                  matched_name = item.find("name").get("value") if item.find("name") is not None else "?"

                  time.sleep(1)
                  thing_url = f"https://boardgamegeek.com/xmlapi2/thing?id={bgg_id}"
                  thing_data = fetch(thing_url)
                  thing_root = ET.fromstring(thing_data)
                  image_el = thing_root.find(".//item/image")
                  if image_el is None or not image_el.text:
                      results[game_id] = {"ok": False, "reason": "no image", "matched_name": matched_name}
                      continue
                  image_url = image_el.text.strip()

                  ext = "jpg"
                  m = re.search(r"\.(jpg|jpeg|png)(\?|$)", image_url, re.IGNORECASE)
                  if m:
                      ext = m.group(1).lower()

                  time.sleep(1)
                  img_bytes = fetch(image_url)
                  out_path = f"public/covers/{game_id}.{ext}"
                  with open(out_path, "wb") as f:
                      f.write(img_bytes)
                  results[game_id] = {"ok": True, "matched_name": matched_name, "bgg_id": bgg_id, "ext": ext, "bytes": len(img_bytes)}
              except Exception as e:
                  results[game_id] = {"ok": False, "reason": str(e)}
              time.sleep(1)

          print(json.dumps(results, indent=2, ensure_ascii=False))
          with open("cover_fetch_results.json", "w") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          PYEOF
          python3 fetch_covers.py
      - name: Commit downloaded covers
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add public/covers cover_fetch_results.json
          if git diff --cached --quiet; then
            echo "No cover changes to commit"
          else
            git commit -m "Add real cover images fetched from BoardGameGeek"
            git push
          fi
