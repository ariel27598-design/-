name: (temp) seed Ran's libraries into kvdb.io
on:
  workflow_dispatch:
  push:
    branches: [claude/boardgame-barcode-scanner-9zh92l]
    paths:
      - '.github/workflows/_tmp-seed-libraries.yml'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed libraries
        run: |
          cat > seed.mjs << 'EOF'
          const BUCKET = 'HSsCa1s8VPbLFWcDf9eNzx';
          const BASE = `https://kvdb.io/${BUCKET}`;

          const libraries = [
            {
              name: 'המשחקים של רן',
              gameIds: ['texas-holdem-poker', 'alcatraz', 'exploding-kittens', 'catan', 'codenames', 'splendor'],
            },
            {
              name: 'בדרכי רן',
              gameIds: ['colored-tumble-tower', 'alias-israel', 'codenames', 'african-mancala', 'davinci-code', 'super-taki', 'dobble'],
            },
          ];

          function keyFor(name) {
            return encodeURIComponent(name.trim().toLowerCase());
          }

          for (const lib of libraries) {
            const key = keyFor(lib.name);
            const payload = { name: lib.name, gameIds: lib.gameIds, updatedAt: Date.now() };
            const putRes = await fetch(`${BASE}/${key}`, { method: 'PUT', body: JSON.stringify(payload) });
            const putBody = await putRes.text();
            console.log(`PUT ${lib.name} -> ${putRes.status}: ${putBody}`);

            const getRes = await fetch(`${BASE}/${key}`);
            const getBody = await getRes.text();
            console.log(`GET ${lib.name} -> ${getRes.status}: ${getBody}`);
          }
          EOF
          node seed.mjs
