name: _tmp-verify-libid
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55
      - run: npx playwright install chromium --with-deps
      - name: Verify stable libId link
        run: |
          node -e "
          (async () => {
            const { chromium } = require('playwright');
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const results = {};
            for (const [key, url] of Object.entries({
              he: 'https://ariel27598-design.github.io/-/#/find?libId=young-judaea',
              en: 'https://ariel27598-design.github.io/-/#/find?libId=young-judaea&lang=en',
            })) {
              await page.goto(url, { waitUntil: 'networkidle' });
              await page.waitForTimeout(1500);
              const bodyText = await page.textContent('body');
              results[key] = {
                hasYoungJudaea: bodyText.includes('Young Judaea'),
                hasYehudaHatzair: bodyText.includes('יהודה הצעיר'),
                has8: bodyText.includes('8'),
                snippet: bodyText.slice(0, 500),
              };
            }
            console.log(JSON.stringify(results, null, 2));
            await browser.close();
          })();
          "
