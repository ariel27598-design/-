name: (temp) kvdb.io bucket setup
on:
  workflow_dispatch:
  push:
    branches: [claude/boardgame-barcode-scanner-9zh92l]
    paths:
      - '.github/workflows/_tmp-kvdb-setup.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create bucket
        run: |
          echo "--- POST https://kvdb.io/ with real owner email ---"
          curl -sS -i -X POST "https://kvdb.io/" -d "email=ariel27598@gmail.com" | tee /tmp/create.txt
          echo ""
          BUCKET=$(tail -n1 /tmp/create.txt | tr -d '\r\n')
          echo "BUCKET_ID=[$BUCKET]"
