name: (temp) seed ערכת המשחקים של רן
on:
  workflow_dispatch:
  push:
    branches: [claude/boardgame-barcode-scanner-9zh92l]
    paths:
      - '.github/workflows/_tmp-seed-ran-kit.yml'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed library
        run: |
          cat > seed.mjs << 'EOF'
          const BUCKET = 'HSsCa1s8VPbLFWcDf9eNzx';
          const BASE = `https://kvdb.io/${BUCKET}`;
          const name = 'ערכת המשחקים של רן';
          const gameIds = ['texas-holdem-poker', 'alcatraz', 'exploding-kittens', 'catan', 'codenames', 'splendor'];
          function keyFor(n) { return encodeURIComponent(n.trim().toLowerCase()); }
          const key = keyFor(name);
          const payload = { name, gameIds, updatedAt: Date.now() };
          const putRes = await fetch(`${BASE}/${key}`, { method: 'PUT', body: JSON.stringify(payload) });
          console.log(`PUT ${name} -> ${putRes.status}: ${await putRes.text()}`);
          const getRes = await fetch(`${BASE}/${key}`);
          console.log(`GET ${name} -> ${getRes.status}: ${await getRes.text()}`);
          EOF
          node seed.mjs
