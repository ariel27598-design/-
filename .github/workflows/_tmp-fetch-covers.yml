name: (temp) fetch real cover images from Wikipedia
on:
  workflow_dispatch:
  push:
    branches: [claude/boardgame-barcode-scanner-9zh92l]
    paths:
      - '.github/workflows/_tmp-fetch-covers.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch covers from Wikipedia
        run: |
          mkdir -p public/covers
          cat > fetch_covers.py << 'PYEOF'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request

          GAMES = [
              ("7-wonders", "7 Wonders (board game)"),
              ("uno", "Uno (card game)"),
              ("taboo", "Taboo (game)"),
              ("dobble", "Spot It!"),
              ("werewolf", "One Night Ultimate Werewolf"),
              ("monopoly", "Monopoly (game)"),
              ("bang", "Bang! (card game)"),
              ("just-one", "Just One (card game)"),
              ("avalon", "Avalon (board game)"),
              ("wingspan", "Wingspan (board game)"),
              ("terraforming-mars", "Terraforming Mars (board game)"),
              ("love-letter", "Love Letter (card game)"),
              ("forbidden-island", "Forbidden Island (board game)"),
              ("exploding-kittens", "Exploding Kittens"),
              ("colored-tumble-tower", "Jenga"),
              ("texas-holdem-poker", "Texas hold 'em"),
          ]

          HEADERS = {"User-Agent": "board-game-matcher-cover-fetch/1.0 (personal hobby app; contact: n/a)"}

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.read()

          results = {}
          for game_id, title in GAMES:
              try:
                  summary_url = f"https://en.wikipedia.org/api/rest_v1/page/summary/{urllib.parse.quote(title)}"
                  data = fetch(summary_url)
                  info = json.loads(data)

                  if info.get("type") != "standard":
                      results[game_id] = {"ok": False, "reason": f"type={info.get('type')}", "title": title}
                      time.sleep(3.5)
                      continue

                  thumb = info.get("originalimage") or info.get("thumbnail")
                  if not thumb or not thumb.get("source"):
                      results[game_id] = {"ok": False, "reason": "no image", "title": title}
                      time.sleep(3.5)
                      continue

                  image_url = thumb["source"]
                  ext = "jpg"
                  m = re.search(r"\.(jpg|jpeg|png|svg)(\?|$)", image_url, re.IGNORECASE)
                  if m:
                      ext = m.group(1).lower()
                  if ext == "svg":
                      results[game_id] = {"ok": False, "reason": "svg image (skipped)", "title": title}
                      time.sleep(3.5)
                      continue

                  img_bytes = fetch(image_url)
                  out_path = f"public/covers/{game_id}.{ext}"
                  with open(out_path, "wb") as f:
                      f.write(img_bytes)
                  results[game_id] = {
                      "ok": True,
                      "title": title,
                      "resolved_title": info.get("title"),
                      "ext": ext,
                      "bytes": len(img_bytes),
                  }
              except Exception as e:
                  results[game_id] = {"ok": False, "reason": str(e), "title": title}
              time.sleep(3.5)

          print(json.dumps(results, indent=2, ensure_ascii=False))
          with open("cover_fetch_results.json", "w") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          PYEOF
          python3 fetch_covers.py
      - name: Commit downloaded covers
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add public/covers cover_fetch_results.json
          if git diff --cached --quiet; then
            echo "No cover changes to commit"
          else
            git commit -m "Add real cover images fetched from Wikipedia"
            git push
          fi
